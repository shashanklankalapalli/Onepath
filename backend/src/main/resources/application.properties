# OnePath Backend Configuration

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.error.include-message=always

# Database Configuration (PostgreSQL with Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onepath_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:qwe}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Development Sample Seed Flag (False by default - keeps colleges completely empty)
app.seed.sample-data=${SEED_SAMPLE_DATA:false}

# AI Assistant Configuration (Google Gemini)
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-2.5-flash}

# User Document Storage & Multipart Configuration
app.upload.dir=${UPLOAD_DIR:uploads/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

